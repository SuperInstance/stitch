[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-substrate"
version = "0.3.0"
description = "A tiny, language-portable substrate primitive for accountable agent state."
# The readme is inlined here on purpose: a file reference outside this
# project root ("../README.md") makes setuptools refuse to build at all
# (cold-test finding F1, 2026-10-27 — `pip install` was broken entirely).
# The full readme lives at the repository root.
readme = { text = "stitch — a tiny, language-portable substrate primitive for accountable agent state: 11 append-only stitches on hash-chained JSONL ledgers, a per-tenant conservation law, and shared state minted only where sovereign ledgers agree. Zero dependencies (Python stdlib only). Full documentation: https://github.com/SuperInstance/stitch", content-type = "text/plain" }
license = { text = "MIT" }
authors = [
    { name = "SuperInstance" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
keywords = ["substrate", "agent", "conservation-law", "append-only", "ledger", "surprise", "accountable-state"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Homepage" = "https://github.com/SuperInstance/stitch"
"Specification" = "https://github.com/SuperInstance/stitch/blob/main/SPEC.md"

[tool.setuptools.packages.find]
include = ["stitch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
